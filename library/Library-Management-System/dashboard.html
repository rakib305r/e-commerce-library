<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="dashboard">


    <aside class="sidebar">

        <h2>📚 Library</h2>


        <a href="dashboard.html">
            Dashboard
        </a>


        <a href="books.html">
            Books
        </a>


        <button id="logoutBtn">
            Logout
        </button>


    </aside>




    <main class="main-content">


        <header class="topbar">


            <h2>
                Welcome, <span id="username"></span>
            </h2>


        </header>




        <section class="cards">


            <div class="card">

                <h3>
                    Total Books
                </h3>

                <p id="totalBooks">
                    0
                </p>

            </div>



            <div class="card">

                <h3>
                    Available Books
                </h3>

                <p id="availableBooks">
                    0
                </p>

            </div>



            <div class="card">

                <h3>
                    Borrowed Books
                </h3>

                <p id="borrowedBooks">
                    0
                </p>

            </div>


        </section>




        <section class="recent">


            <h2>
                Recent Activity
            </h2>


            <div class="activity">

                <p>
                    📚 Library system started
                </p>

                <p>
                    ➕ New books can be added
                </p>

                <p>
                    🔍 Search books easily
                </p>


            </div>


        </section>



    </main>


</div>



<script src="js/app.js"></script>


</body>

</html>
<a href="borrow.html">
    Borrow
</a>
