<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Signup</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-body">


<div class="auth-container">


<div class="auth-logo">
📚
</div>


<h1>
Library
</h1>


<h3>
Create your account
</h3>



<form id="signupForm">



<div class="auth-group">

<label>
Full Name
</label>

<input 
id="name"
type="text"
placeholder="Enter your name"
>

</div>




<div class="auth-group">

<label>
Email
</label>

<input 
id="email"
type="email"
placeholder="Enter your email"
>

</div>




<div class="auth-group">

<label>
Password
</label>

<input 
id="password"
type="password"
placeholder="Create password"
>

</div>




<div class="auth-group">

<label>
Confirm Password
</label>

<input 
id="confirmPassword"
type="password"
placeholder="Confirm password"
>

</div>





<button 
type="submit"
class="auth-btn">

Sign Up

</button>



</form>





<div class="auth-link">

Already have an account?

<a href="index.html">
Login
</a>


</div>



</div>



<script src="js/auth.js"></script>


</body>

</html>
