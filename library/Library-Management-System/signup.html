<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                📓CSTian BOOKSTORE
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="books.html" class="nav-link">Books</a>
                <a href="cart.html" class="nav-link">Cart <span id="cartCount" class="cart-badge">0</span></a>
                <button id="themeToggle" class="theme-toggle" title="Toggle Dark Theme">
                </button>
                <div id="userNav" class="user-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <button id="logoutBtn" class="nav-btn">Logout</button>
                </div>
                <div id="authNav" class="auth-nav">
                    <a href="login.html" class="nav-link">Login</a>
                    <a href="signup.html" class="nav-link active">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-logo">
                📚
            </div>
            <h1>
                Create Account
            </h1>
            <h3>
                Join BookStore today
            </h3>
            <form id="signupForm">
                <div class="auth-group">
                    <label>
                        Full Name
                    </label>
                    <input id="name" type="text" placeholder="Enter your name" required minlength="2">
                </div>
                <div class="auth-group">
                    <label>
                        Email
                    </label>
                    <input id="email" type="email" placeholder="Enter your email" required>
                </div>
                <div class="auth-group">
                    <label>
                        Password
                    </label>
                    <input id="password" type="password" placeholder="Create password (min 6 characters)" required
                        minlength="6">
                </div>
                <div class="auth-group">
                    <label>
                        Confirm Password
                    </label>
                    <input id="confirmPassword" type="password" placeholder="Confirm password" required minlength="6">
                </div>
                <button type="submit" class="auth-btn">

                    Sign Up
                </button>
            </form>
            <div class="auth-link">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </div>
        </div>
    </section>
    <script src="js/cart.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
</body>

</html>
