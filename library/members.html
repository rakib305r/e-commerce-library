<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Members</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="dashboard">


    <aside class="sidebar">

        <h2>📚 Library</h2>


        <a href="dashboard.html">
            Dashboard
        </a>


        <a href="books.html">
            Books
        </a>


        <a href="borrow.html">
            Borrow
        </a>


        <a href="members.html">
            Members
        </a>


        <button id="logoutBtn">
            Logout
        </button>


    </aside>




    <main class="main-content">


        <header class="topbar">

            <h2>
                Member Management
            </h2>

        </header>




        <section class="book-tools">


            <input 
            type="text"
            id="searchMember"
            placeholder="Search member..."
            >


        </section>





        <section class="add-book">


            <input
            type="text"
            id="memberName"
            placeholder="Member Name"
            >



            <input
            type="email"
            id="memberEmail"
            placeholder="Member Email"
            >



            <button id="addMemberBtn">
                Add Member
            </button>


        </section>





        <section 
        id="memberContainer"
        class="book-container">


        </section>




    </main>


</div>



<script src="js/app.js"></script>


</body>

</html>
